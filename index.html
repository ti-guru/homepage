<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Content Security Policy — no inline scripts/styles, no external origins -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 style-src 'self';
                 script-src 'self';
                 font-src 'self';
                 img-src 'self' data:;
                 media-src 'self';
                 frame-ancestors 'none';
                 base-uri 'self';
                 form-action 'none';">

  <!-- Prevent MIME-type sniffing -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Deny framing (clickjacking) -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- Minimal referrer information sent to external links -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Anders Egeland</title>
  <meta name="description" content="Anders Egeland – Lege, klatrer og nerd. Utforsker sky, media og foto.">
  <meta name="author" content="Anders Egeland">
  <link rel="canonical" href="https://andersegeland.no/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://andersegeland.no/">
  <meta property="og:title" content="Anders Egeland">
  <meta property="og:description" content="Lege. Klatrer. Nerd.">
  <meta property="og:image" content="https://andersegeland.no/assets/og-image.jpg">
  <meta property="og:locale" content="nb_NO">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anders Egeland">
  <meta name="twitter:description" content="Lege. Klatrer. Nerd.">
  <meta name="twitter:image" content="https://andersegeland.no/assets/og-image.jpg">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Anders Egeland",
    "url": "https://andersegeland.no",
    "description": "Lege. Klatrer. Nerd.",
    "sameAs": [
      "https://cloud.andersegeland.no",
      "https://media.andersegeland.no",
      "https://photos.andersegeland.no"
    ]
  }
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Background video -->
  <div class="bg" aria-hidden="true">
    <video autoplay muted loop playsinline>
      <source src="assets/video/background.mp4" type="video/mp4">
      <source src="assets/video/background.webm" type="video/webm">
    </video>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Main content -->
  <main>
    <div class="hero">
      <h1>Anders Egeland</h1>
      <p class="subtitle">Lege.&ensp;Klatrer.&ensp;Nerd.</p>

      <nav aria-label="External services">
        <ul class="links">

          <li>
            <a href="https://cloud.andersegeland.no" class="link-icon" rel="noopener noreferrer" aria-label="Cloud">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
              </svg>
            </a>
            <span class="link-label">Sky</span>
          </li>

          <li>
            <a href="https://media.andersegeland.no" class="link-icon" rel="noopener noreferrer" aria-label="Media">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/>
                <line x1="7"  y1="2"  x2="7"  y2="22"/>
                <line x1="17" y1="2"  x2="17" y2="22"/>
                <line x1="2"  y1="12" x2="22" y2="12"/>
                <line x1="2"  y1="7"  x2="7"  y2="7"/>
                <line x1="2"  y1="17" x2="7"  y2="17"/>
                <line x1="17" y1="17" x2="22" y2="17"/>
                <line x1="17" y1="7"  x2="22" y2="7"/>
              </svg>
            </a>
            <span class="link-label">Media</span>
          </li>

          <li>
            <a href="https://photos.andersegeland.no" class="link-icon" rel="noopener noreferrer" aria-label="Photos">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
            </a>
            <span class="link-label">Foto</span>
          </li>

        </ul>
      </nav>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="year"></span> Anders Egeland</p>
  </footer>

  <script src="assets/js/main.js"></script>

</body>
</html>
